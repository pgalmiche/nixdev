# Portable tmux config, shipped via Nix (see ../flake.nix).
# Mirrors ~/.tmux.conf. Plugins are run-shell'd in from nixpkgs' tmuxPlugins
# in flake.nix instead of TPM, so nothing is cloned/fetched at runtime.

set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

set-option -g status-position top
set-option -g default-shell /bin/zsh

set -g mouse on

# prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind -n M-H previous-window
bind -n M-L next-window

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Window tabs show the running program (zsh, nvim, ...), not the full
# hostname. Panes here run the host's own real /bin/zsh (default-shell
# below), whose personal rc/terminal profile commonly emits an OSC title
# escape like "user@hostname: cwd" - allow-rename off (explicit, since a
# host-wide /etc/tmux.conf loads before this file and could've turned it
# on) stops that escape sequence from overriding the window name; tmux then
# falls back to automatic-rename's own #{pane_current_command}.
set-window-option -g automatic-rename on
set-option -g automatic-rename-format "#{pane_current_command}"
set-option -g allow-rename off

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# plugin options (plugins themselves are wired in via flake.nix)
set -g @continuum-restore 'on'

# catppuccin/tmux's window tab text defaults to #T (pane_title), which tmux
# initializes to the hostname and only ever updates if the program running
# in the pane sends an OSC "set title" escape sequence - nvim/lazygit/
# lazydocker don't, so every tab is stuck showing the hostname forever.
# #{pane_current_command} (what automatic-rename-format above already uses)
# reflects the pane's actual foreground process directly, no escape sequence
# needed, so tabs show "nvim"/"lazygit"/"lazydocker"/"zsh" live instead.
set -g @catppuccin_window_text " #{pane_current_command}"
set -g @catppuccin_window_current_text " #{pane_current_command}"

# resurrect/continuum restore each window's saved name via `rename-window`,
# and tmux treats any rename-window call as "manually renamed" - which
# permanently disables automatic-rename for that window (see
# automatic-rename-format above). Net effect without this: after a restore,
# every restored tab gets stuck showing whatever was last saved (e.g.
# "nvim") no matter what you actually run in it next (lazygit, lazydocker,
# a plain shell, ...). This hook runs right after every restore and forces
# automatic-rename back on for every window, undoing that.
set -g @resurrect-hook-post-restore-all 'tmux list-windows -a -F "#{session_name}:#{window_index}" | xargs -I {} tmux set-window-option -t {} automatic-rename on'
# set -g @catppuccin_flavor 'mocha'  # uncomment to pick a flavor
